<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Luna Living Wallpaper</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <main id="scene" class="scene state-awake">
    <div class="night-depth"></div>
    <div id="videoShell" class="video-shell">
      <img id="poster" class="poster" src="assets/poster.jpg" alt="" />
      <video id="loopA" class="living-video loop-video visible" muted playsinline preload="auto"></video>
      <video id="loopB" class="living-video loop-video" muted playsinline preload="auto"></video>
      <video id="transitionVideo" class="living-video transition-video" muted playsinline preload="auto"></video>
      <div class="screen-glow"></div>
    </div>
    <div class="left-veil"></div>
    <div id="speech" class="speech">Mình ở đây ✦</div>
    <section id="brightnessHud" class="brightness-hud" aria-live="polite">
      <div class="sun">☀</div>
      <div class="brightness-main">
        <div class="bar"><i id="brightnessFill"></i><b id="brightnessKnob"></b></div>
        <div id="brightnessCaption" class="caption">Độ sáng 100% · Awake</div>
      </div>
      <strong id="brightnessValue">100%</strong>
    </section>
    <div class="desktop-hint">LUNA · Ctrl+Alt+W để trò chuyện</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
